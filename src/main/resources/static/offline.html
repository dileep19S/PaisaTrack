<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14532D" />
  <title>Offline - PaisaTrack</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-wrapper">
    <section class="auth-card" style="text-align: center;">
      <div class="brand-emblem" style="margin: 0 auto 1rem;">₹</div>
      <h1 class="auth-title">You are offline</h1>
      <p class="auth-subtitle">
        PaisaTrack keeps all financial records securely in MySQL and does not store transaction data locally on your device.
        Reconnect to the network to view your dashboard.
      </p>
      <button type="button" class="btn btn-primary btn-block" onclick="window.location.reload()">
        Try Again
      </button>
    </section>
  </main>
</body>
</html>
