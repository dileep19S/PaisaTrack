# ============================================================================
# PaisaTrack - Application Configuration
# Database credentials are injected via environment variables (never hardcoded)
# ============================================================================

spring.application.name=PaisaTrack
server.port=${SERVER_PORT:8080}

# MySQL 8.x Community Edition DataSource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/paisatrack_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
# Schema is managed explicitly via sql/01_create_database.sql, 02_create_tables.sql, 03_seed_categories.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Indian Timezone & Jackson Serialization
spring.jackson.time-zone=Asia/Kolkata

# Session Cookie Security
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
