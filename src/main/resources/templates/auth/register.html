<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="auth-body">

<main class="auth-wrapper">
  <section class="auth-card">
    <div class="brand-emblem" aria-hidden="true">₹</div>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Start tracking your finances in Indian Rupees (₹).</p>

    <div th:if="${registerError}" class="alert alert-error" th:text="${registerError}"></div>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <input id="fullName" type="text" th:field="*{fullName}" class="form-control"
               placeholder="e.g. Aarav Sharma" required autocomplete="name" />
        <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input id="email" type="email" th:field="*{email}" class="form-control"
               placeholder="aarav@example.com" required autocomplete="email" />
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" th:field="*{password}" class="form-control"
               placeholder="Minimum 6 characters" required autocomplete="new-password" />
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control"
               placeholder="Re-enter your password" required autocomplete="new-password" />
        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a th:href="@{/login}">Log in</a>
    </p>
  </section>
</main>

</body>
</html>
