<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log In')}"></head>
<body class="auth-body">

<main class="auth-wrapper">
  <section class="auth-card">
    <div class="brand-emblem" aria-hidden="true">₹</div>
    <h1 class="auth-title">Welcome to PaisaTrack</h1>
    <p class="auth-subtitle">Sign in to manage your daily income and expenses.</p>

    <div th:if="${registerSuccess}" class="alert alert-success" th:text="${registerSuccess}"></div>
    <div th:if="${param.logout}" class="alert alert-success">You have been logged out securely.</div>
    <div th:if="${param.error}" class="alert alert-error">Invalid email or password. Please try again.</div>

    <form th:action="@{/login}" method="post" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input id="email" name="email" type="email" class="form-control"
               placeholder="rahul@example.com" required autocomplete="email" autofocus />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" name="password" type="password" class="form-control"
               placeholder="Enter your password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <p class="auth-footer">
      New to PaisaTrack? <a th:href="@{/register}">Create an account</a>
    </p>
  </section>
</main>

</body>
</html>
