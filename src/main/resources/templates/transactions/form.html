<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Edit Transaction' : 'Add Transaction')}"></head>
<body>

<header th:replace="~{fragments/layout :: topbar(${activeTab})}"></header>

<main class="app-main">
  <div class="form-card">
    <div class="page-header">
      <div>
        <h1 class="page-title" th:text="${isEdit} ? 'Edit Transaction' : 'Add Transaction'">Add Transaction</h1>
        <p class="page-subtitle">All records are saved securely in your MySQL ledger.</p>
      </div>
      <a th:href="@{/transactions}" class="btn btn-outline btn-sm">Back to History</a>
    </div>

    <div class="card">
      <div th:if="${formError}" class="alert alert-error" th:text="${formError}"></div>

      <form th:action="@{/transactions/save}" th:object="${transactionForm}" method="post" novalidate>
        <input type="hidden" th:field="*{transactionId}" />

        <div class="form-group">
          <span class="form-label">Transaction Type</span>
          <div class="segmented-toggle">
            <div class="segmented-option">
              <input id="type-expense" type="radio" th:field="*{transactionType}" value="EXPENSE" />
              <label for="type-expense">Expense</label>
            </div>
            <div class="segmented-option">
              <input id="type-income" type="radio" th:field="*{transactionType}" value="INCOME" />
              <label for="type-income">Income</label>
            </div>
          </div>
          <div class="field-error" th:if="${#fields.hasErrors('transactionType')}" th:errors="*{transactionType}"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="amount">Amount (₹ INR)</label>
          <input id="amount" type="number" step="0.01" min="0.01" th:field="*{amount}"
                 class="form-control tabular-nums" placeholder="e.g. 250.00" required />
          <div class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="categoryId">Category</label>
          <select id="categoryId" th:field="*{categoryId}" class="form-control" required>
            <option th:each="cat : ${expenseCategories}"
                    th:value="${cat.categoryId}"
                    th:text="${cat.categoryName}"
                    data-type="EXPENSE">Food</option>
            <option th:each="cat : ${incomeCategories}"
                    th:value="${cat.categoryId}"
                    th:text="${cat.categoryName}"
                    data-type="INCOME">Salary</option>
          </select>
          <div class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="transactionDate">Transaction Date</label>
          <input id="transactionDate" type="date" th:field="*{transactionDate}"
                 class="form-control" required />
          <div class="field-error" th:if="${#fields.hasErrors('transactionDate')}" th:errors="*{transactionDate}"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Description (Optional)</label>
          <input id="description" type="text" th:field="*{description}" maxlength="255"
                 class="form-control" placeholder="e.g. Mess lunch, Metro card recharge, Internship stipend" />
          <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block"
                th:text="${isEdit} ? 'Update Transaction' : 'Save Transaction'">Save Transaction</button>
      </form>
    </div>
  </div>
</main>

<div th:replace="~{fragments/layout :: bottomNav(${activeTab})}"></div>

</body>
</html>
