# ============================================================================
# PaisaTrack Integration Test Configuration (Real MySQL 8.x — NO H2/In-Memory)
# Uses DB_URL, DB_USERNAME, DB_PASSWORD environment variables
# ============================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/paisatrack_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata
